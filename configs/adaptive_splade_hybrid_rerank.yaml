method: adaptive_splade_hybrid_rerank

splade:
  model_name: naver/splade-cocondenser-ensembledistil
  batch_size: 8
  max_length: 256

dense:
  model_name: intfloat/e5-small-v2
  batch_size: 32
  normalize_embeddings: true
  query_prefix: "query: "
  document_prefix: "passage: "

retrieval:
  splade_top_k: 100
  bm25_top_k: 100
  dense_top_k: 100
  candidate_k: 100

fusion:
  strategy: weighted_rrf
  rrf_k: 1
  adaptive: false
  weights:
    splade: 0.32
    bm25: 0.19
    dense: 0.49
  adaptive_weights:
    entity_heavy:
      splade: 0.32
      bm25: 0.19
      dense: 0.49
    long_semantic:
      splade: 0.32
      bm25: 0.19
      dense: 0.49
    default:
      splade: 0.32
      bm25: 0.19
      dense: 0.49

rerank:
  enabled: false
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 10
